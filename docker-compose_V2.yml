version: "3"
services:

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CACHE}/jellyfin/config:/config
      - ${DOCKER_FILES}/data/media:/data/media
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
    network_mode: "host"

  plex:
    image: linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - PLEX_CLAIM=claim-xNT3ojW2XgBX-ftEq3uV
      - VERSION=docker
    volumes:
      - ${DOCKER_CACHE}/plex/config:/config
      - ${DOCKER_FILES}/data/media:/data/media
    ports:
      - 32400:32400
    restart: unless-stopped
    network_mode: "host"

  jackett:
    image: linuxserver/jackett
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - RUN_OPTS=run options here #optional
    volumes:
      - ${DOCKER_CONFIG}/jackett/config:/config
    ports:
      - 9117:9117
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG}/bazarr/config:/config
      - ${DOCKER_FILES}/data/media/movies:/movies
      - ${DOCKER_FILES}/data/media/tv:/tv
    ports:
      - 6767:6767
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - UMASK_SET=022 #optional
    volumes:
      - ${DOCKER_CONFIG}/sonarr/config:/config
      - ${DOCKER_FILES}/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG}/radarr/config:/config
      - ${DOCKER_FILES}/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  speedtest:
    image: openspeedtest/latest
    container_name: openspeedtest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
    - '3000:3000'
    - '3001:3001'
    restart: unless-stopped

  netdata:
    image: netdata/netdata
    container_name: netdata
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - netdata_config:/etc/netdata
      - netdata_data:/var/lib/netdata
      - netdata_log:/var/log/netdata
    ports:
      - "19999:19999"
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ${DOCKER_CONFIG}/gluetun/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_PRIVATE_ADDR}
      - SERVER_CITIES=Oslo
      - OWNED_ONLY=yes
      - VPN_ENDPOINT_PORT=51820
      - FIREWALL_VPN_INPUT_PORTS=${MULLVAD_INPUT_PORTS}
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24
      - DNS_ADDRESS=10.64.0.1
    ports:
      - 8888:8888/tcp
      - 8388:8388/tcp
      - 8388:8388/udp
      - 8080:8080/tcp
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: container:gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG}/qbittorrent/config:/config
      - ${DOCKER_FILES}/data/downloads:/data/downloads
    restart: unless-stopped

  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG}/homarr/configs:/app/data/configs
      - ${DOCKER_CONFIG}/homarr/data:/data
      - ${DOCKER_CONFIG}/homarr/icons:/app/public/icons
    ports:
      - "80:7575"
    restart: always

volumes:
  netdata_config:
  netdata_data:
  netdata_log:
